name: Bevaka SkandiaMäklarna

on:
  schedule:
    - cron: "0 6-19 * * *"
  workflow_dispatch:
    inputs:
      forsta_gangen:
        description: "Bocka i FÖRSTA gången du kör. Då sparas alla befintliga objekt tyst, utan att hamna på Monday."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: skm-scraper
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bygg baslinje
        if: inputs.forsta_gangen
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: python skm_scraper.py --first-run --no-excel

      - name: Sök av kontoren
        if: ${{ !inputs.forsta_gangen }}
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: python skm_scraper.py --no-excel

      - name: Spara vad som setts
        run: |
          git config user.name "skm-scraper"
          git config user.email "bot@cbmedia.se"
          git add state.json
          git diff --staged --quiet || git commit -m "Avsokning $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
